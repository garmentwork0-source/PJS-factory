<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b7a"><link rel="manifest" href="manifest.webmanifest"><title>PJS Garment</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18243a;font:15px Arial}header{background:#123b7a;color:white;padding:16px;font-size:21px;font-weight:bold}header small{display:block;font-size:12px;font-weight:normal}nav{display:flex;overflow:auto;background:#0d2e65;padding:6px;gap:4px;position:sticky;top:0}nav button{white-space:nowrap;background:transparent;color:white;border:0;padding:10px;border-radius:7px}nav button.on{background:#326cc0}main{padding:16px;max-width:1200px;margin:auto}h1{color:#123b7a;font-size:23px}.card,.panel{background:white;border:1px solid #dce4f0;border-radius:12px;padding:15px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{color:#68778c;font-size:12px}.val{font-size:21px;font-weight:bold;color:#123b7a;margin-top:7px}form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}input,select{width:100%;padding:10px;border:1px solid #cbd6e5;border-radius:7px;background:white}.btn{padding:10px 14px;border:0;border-radius:8px;background:#1e63c5;color:white;font-weight:bold;margin:8px 5px 0 0}.secondary{background:#e7eef9;color:#123b7a}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px;font-size:13px}th{background:#123b7a;color:white;text-align:left}td,th{padding:9px;border-bottom:1px solid #e2e8f0}.hint{background:#fff7e5;padding:10px;border-radius:8px;font-size:12px;color:#76551c}.muted{color:#68778c;font-size:12px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}form{grid-template-columns:1fr}main{padding:10px}}
@media print{header,nav,.noprint{display:none}main{padding:0}.panel,.card{break-inside:avoid}}
</style></head><body><header>PJS GARMENT <small>Management System · Kathmandu, Nepal · 9860463605</small></header><nav id="nav"></nav><main id="app"></main><script>
const K='pjs-garment-v1',blank={bills:[],daily:[],stock:[],returns:[],workers:[],staff:[],salary:[]};let d;try{d={...blank,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){d={...blank}}
const save=()=>localStorage.setItem(K,JSON.stringify(d)),today=()=>new Date().toISOString().slice(0,10),n=x=>Math.max(0,+x||0),cash=x=>'NPR '+n(x).toLocaleString('en-IN',{minimumFractionDigits:2}),id=()=>Date.now().toString(36);
const pages=['Dashboard','Sales & Billing','Customer Ledger','Sales Returns','Finished Stock','Worker PC Rate','Staff Salary','Daily Record','Reports'];
let current='Dashboard';const nav=document.getElementById('nav');
function go(p){current=p;[...nav.children].forEach(b=>b.classList.toggle('on',b.textContent===p));render()}
pages.forEach(p=>{let b=document.createElement('button');b.textContent=p;b.onclick=()=>go(p);nav.append(b)});
function f(label,name,type='text',extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" ${extra}></div>`}
function sel(label,name,opts){return `<div><label>${label}</label><select name="${name}">${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`}
function form(id,fields){return `<form id="${id}">${fields}</form>`}
function table(head,rows){return `<div class="tablewrap"><table><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')}</table></div>`}
function daily(date,particular,ref,inc,exp,mode,related=''){d.daily.push({date,particular,ref,inc,exp,mode,related})}
function stockBal(item,article,size){return d.stock.filter(x=>x.item===item&&x.article===article&&(x.size||'')===(size||'')).reduce((s,x)=>s+x.in-x.out,0)}
function workerBal(w){return d.workers.filter(x=>x.worker===w).reduce((s,x)=>s+x.credit-x.debit,0)}
function render(){let a=document.getElementById('app'),inc=d.daily.reduce((s,x)=>s+x.inc,0),exp=d.daily.reduce((s,x)=>s+x.exp,0),stock=d.stock.reduce((s,x)=>s+x.in-x.out,0);
let billRows=d.bills.slice().reverse().map(x=>[x.date,x.no,x.customer,x.item+' / '+x.article,x.qty,cash(x.total),cash(x.paid),cash(x.total-x.paid)]);
let dailyRows=d.daily.slice().reverse().map(x=>[x.date,x.particular,x.ref,cash(x.inc),cash(x.exp),x.mode]);
let content='';
if(current==='Dashboard')content=`<h1>Dashboard</h1><div class="cards"><div class="card"><div class="metric">Total Sales</div><div class="val">${cash(d.bills.reduce((s,x)=>s+x.total,0))}</div></div><div class="card"><div class="metric">Collections</div><div class="val">${cash(d.daily.filter(x=>x.particular.includes('Payment Received')).reduce((s,x)=>s+x.inc,0))}</div></div><div class="card"><div class="metric">Expenses</div><div class="val">${cash(exp)}</div></div><div class="card"><div class="metric">Finished Stock</div><div class="val">${stock} PCs</div></div></div><section class="panel"><h3>Quick actions</h3>${pages.slice(1,8).map(p=>`<button class="btn" onclick="go('${p}')">${p}</button>`).join('')}</section><section class="panel"><b>Daily position</b><p>Income: ${cash(inc)} · Expense: ${cash(exp)} · Net: ${cash(inc-exp)}</p></section>`;
if(current==='Sales & Billing')content=`<h1>Sales & Billing</h1><section class="panel"><h3>Create bill</h3>${form('bill',f('Date','date','date','required')+f('Bill No.','no','text','required')+f('Customer','customer','text','required')+f('Item','item','text','required')+f('Article','article','text','required')+f('Size','size')+f('Quantity PCs','qty','number','required')+f('Rate NPR','rate','number','required')+f('Paid now NPR','paid','number')+sel('Mode','mode',['Cash','Cheque','Credit']))}<button class="btn" onclick="billSave()">Save Bill & Print</button><button class="btn secondary" onclick="print()">Print</button><p class="hint">Bill automatically reduces finished stock and creates the customer debit. Cash/cheque collected now is recorded in the daily book.</p></section><section class="panel"><h3>Recent bills</h3>${table(['Date','Bill','Customer','Item / Article','PCs','Total','Paid','Due'],billRows)}</section>`;
if(current==='Customer Ledger')content=`<h1>Customer Ledger</h1><section class="panel"><h3>Payment received</h3>${form('cpay',f('Date','date','date','required')+f('Customer','customer','text','required')+f('Amount NPR','amount','number','required')+sel('Mode','mode',['Cash','Cheque','Bank Transfer'])+f('Voucher / reference','ref'))}<button class="btn" onclick="customerPay()">Save payment</button></section><section class="panel"><h3>Customer balances</h3>${table(['Customer','Sales','Payments','Returns','Outstanding'],[...new Set(d.bills.map(x=>x.customer))].map(c=>{let s=d.bills.filter(x=>x.customer===c).reduce((a,x)=>a+x.total,0),p=d.bills.filter(x=>x.customer===c).reduce((a,x)=>a+x.paid,0)+d.daily.filter(x=>x.related===c).reduce((a,x)=>a+x.inc,0),r=d.returns.filter(x=>x.customer===c&&x.settle==='Ledger Adjustment').reduce((a,x)=>a+x.amount,0);return [c,cash(s),cash(p),cash(r),cash(s-p-r)]}))}</section>`;
if(current==='Sales Returns')content=`<h1>Sales Returns</h1><section class="panel"><h3>Record return</h3>${form('ret',f('Date','date','date','required')+f('Customer','customer','text','required')+f('Original bill no.','bill','text')+f('Item','item','text','required')+f('Article','article','text','required')+f('Size','size')+f('Returned PCs','qty','number','required')+f('Rate NPR','rate','number','required')+sel('Condition','condition',['Good / Usable','Damaged'])+sel('Settlement','settle',['Ledger Adjustment','Cash Refund','Goods Replacement']))}<button class="btn" onclick="returnSave()">Save return</button><p class="hint">Good goods return to usable stock; damaged goods are kept out of usable stock. Cash refunds are daily expenses.</p></section><section class="panel">${table(['Date','Customer','Item','Article','PCs','Amount','Condition','Settlement'],d.returns.map(x=>[x.date,x.customer,x.item,x.article,x.qty,cash(x.amount),x.condition,x.settle]))}</section>`;
if(current==='Finished Stock')content=`<h1>Finished Goods Stock · PCs</h1><section class="panel"><h3>Stock in / out</h3>${form('st',f('Date','date','date','required')+sel('Particular','part',['Opening Stock','Production Received','Manual Stock In','Manual Stock Out','Damaged / Write-off'])+f('Item','item','text','required')+f('Article','article','text','required')+f('Size','size')+f('Stock In PCs','in','number')+f('Stock Out PCs','out','number')+f('Reference','ref'))}<button class="btn" onclick="stockSave()">Save stock</button><p class="hint">Sales bills and good sales returns update stock automatically. Cutting/fabric KG and meters are not part of this finished-goods ledger.</p></section><section class="panel">${table(['Item','Article','Size','In','Out','Balance'],[...new Set(d.stock.map(x=>[x.item,x.article,x.size].join('|')))].map(k=>{let [i,a,s]=k.split('|'),z=d.stock.filter(x=>x.item===i&&x.article===a&&(x.size||'')===s),inn=z.reduce((t,x)=>t+x.in,0),out=z.reduce((t,x)=>t+x.out,0);return [i,a,s,inn,out,inn-out]}))}</section>`;
if(current==='Worker PC Rate')content=`<h1>Worker PC Rate Ledger</h1><section class="panel"><h3>Work credit or payment debit</h3>${form('wk',f('Date','date','date','required')+f('Worker','worker','text','required')+f('Particular / work','particular','text','required')+f('Piece PCs','pcs','number')+f('Rate per PC','rate','number')+sel('Entry type','type',['Work Credit','Payment Debit'])+f('Payment amount (only for debit)','amount','number')+sel('Mode','mode',['Cash','Cheque','Bank Transfer']))}<button class="btn" onclick="workerSave()">Save worker entry</button><p class="hint">Work Credit = PCs × Rate. Payments reduce the balance and are recorded as daily expenses. No monthly salary is included here.</p></section><section class="panel">${table(['Date','Worker','Particular','PCs','Rate','Credit','Debit','Balance'],d.workers.map(x=>[x.date,x.worker,x.particular,x.pcs,x.rate,cash(x.credit),cash(x.debit),cash(workerBal(x.worker))]))}</section>`;
if(current==='Staff Salary')content=`<h1>Staff Monthly Salary</h1><section class="panel"><h3>Salary payment</h3>${form('sal',f('Date','date','date','required')+f('Staff name','staff','text','required')+f('Designation','designation')+f('Salary month','month','month','required')+f('Basic salary','basic','number')+f('Advance','advance','number')+f('Deduction','deduction','number')+f('Paid now','paid','number','required')+sel('Mode','mode',['Cash','Cheque','Bank Transfer']))}<button class="btn" onclick="salarySave()">Save salary payment</button><p class="hint">Staff monthly salary is separate from worker PC-rate earnings.</p></section><section class="panel">${table(['Date','Staff','Designation','Month','Basic','Advance','Deduction','Paid'],d.salary.map(x=>[x.date,x.staff,x.designation,x.month,cash(x.basic),cash(x.advance),cash(x.deduction),cash(x.paid)]))}</section>`;
if(current==='Daily Record')content=`<h1>Daily Record · Cash + Bank Combined</h1><section class="panel"><h3>Income / expense entry</h3>${form('dr',f('Date','date','date','required')+f('Particular','particular','text','required')+f('Reference / voucher','ref')+sel('Type','type',['Income','Expense'])+f('Amount NPR','amount','number','required')+sel('Mode','mode',['Cash','Cheque','Bank Transfer','Cash/Bank Combined'])+f('Related customer / person','related'))}<button class="btn" onclick="dailySave()">Save daily entry</button></section><div class="cards"><div class="card"><div class="metric">Total income</div><div class="val">${cash(inc)}</div></div><div class="card"><div class="metric">Total expenses</div><div class="val">${cash(exp)}</div></div><div class="card"><div class="metric">Net balance movement</div><div class="val">${cash(inc-exp)}</div></div></div><section class="panel">${table(['Date','Particular','Reference','Income','Expense','Mode'],dailyRows)}</section>`;
if(current==='Reports')content=`<h1>Reports & Backup</h1><section class="panel"><button class="btn" onclick="print()">Print / Save PDF</button><button class="btn" onclick="backup()">Download Full Backup</button><button class="btn secondary" onclick="document.getElementById('restore').click()">Restore Backup</button><input id="restore" type="file" accept=".json" hidden onchange="restore(event)"><p class="hint">Data is stored in this browser on this device. Download backups regularly. This is a starter version; cloud sync, user login and shared access need a hosted database.</p></section>`;
a.innerHTML=content}
function vals(id){return Object.fromEntries(new FormData(document.getElementById(id)).entries())}
function billSave(){let x=vals('bill'),q=n(x.qty),t=q*n(x.rate),p=Math.min(t,n(x.paid));if(!x.customer||!x.no||!x.item||!x.article||!q||!n(x.rate))return alert('Complete required fields');if(d.bills.some(b=>b.no===x.no))return alert('Bill number already exists');d.bills.push({...x,qty:q,rate:n(x.rate),total:t,paid:p});d.stock.push({date:x.date,part:'Sales Bill',item:x.item,article:x.article,size:x.size,in:0,out:q});if(p)daily(x.date,'Sales Bill Payment',x.no,p,0,x.mode);save();alert('Bill saved and stock reduced.');go('Sales & Billing')}
function customerPay(){let x=vals('cpay'),a=n(x.amount);if(!x.customer||!a)return alert('Enter customer and amount');daily(x.date,'Customer Payment Received',x.ref,a,0,x.mode,x.customer);save();go('Customer Ledger')}
function returnSave(){let x=vals('ret'),a=n(x.qty)*n(x.rate);if(!x.customer||!x.item||!n(x.qty))return alert('Complete return fields');d.returns.push({...x,amount:a});if(x.condition==='Good / Usable')d.stock.push({date:x.date,part:'Sales Return',item:x.item,article:x.article,size:x.size,in:n(x.qty),out:0});if(x.settle==='Cash Refund')daily(x.date,'Sales Return Cash Refund',x.bill,0,a,'Cash');if(x.settle==='Goods Replacement')d.stock.push({date:x.date,part:'Replacement issue (verify)',item:x.item,article:x.article,size:x.size,in:0,out:n(x.qty)});save();go('Sales Returns')}
function stockSave(){let x=vals('st');if(!x.item||!x.article)return alert('Enter item and article');d.stock.push({...x,in:n(x.in),out:n(x.out)});save();go('Finished Stock')}
function workerSave(){let x=vals('wk'),credit=x.type==='Work Credit'?n(x.pcs)*n(x.rate):0,debit=x.type==='Payment Debit'?n(x.amount):0;if(!x.worker||!x.particular||(!credit&&!debit))return alert('Enter worker, particular and work/payment values');d.workers.push({...x,pcs:n(x.pcs),rate:n(x.rate),credit,debit});if(debit)daily(x.date,'Worker Payment - '+x.worker,'',0,debit,x.mode);save();go('Worker PC Rate')}
function salarySave(){let x=vals('sal');if(!x.staff||!n(x.paid))return alert('Enter staff and paid amount');d.salary.push(x);daily(x.date,'Staff Salary Payment - '+x.staff,'',0,n(x.paid),x.mode);save();go('Staff Salary')}
function dailySave(){let x=vals('dr'),a=n(x.amount);if(!x.particular||!a)return alert('Enter particular and amount');daily(x.date,x.particular,x.ref,x.type==='Income'?a:0,x.type==='Expense'?a:0,x.mode,x.related);save();go('Daily Record')}
function backup(){let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pjs-garment-backup.json';a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{let z=JSON.parse(r.result);if(confirm('Replace current data with this backup?')){d={...blank,...z};save();go('Dashboard')}}catch(err){alert('Invalid backup file')}};r.readAsText(e.target.files[0])}
go('Dashboard');
</script></body></html>
